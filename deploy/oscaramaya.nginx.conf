server {
    server_name paredesdesarrollosinmobiliarios.com www.paredesdesarrollosinmobiliarios.com 67.205.145.246;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        alias /var/www/OscarAmaya/staticfiles/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    location /media/ {
        alias /var/www/OscarAmaya/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare envía X-Forwarded-Proto: https aunque el origen sea HTTP
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/paredesdesarrollosinmobiliarios.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paredesdesarrollosinmobiliarios.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.paredesdesarrollosinmobiliarios.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = paredesdesarrollosinmobiliarios.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name paredesdesarrollosinmobiliarios.com www.paredesdesarrollosinmobiliarios.com 67.205.145.246;
    return 404; # managed by Certbot




}
