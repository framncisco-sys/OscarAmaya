{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
  {% if page_obj.has_previous %}
    <a href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Anterior</a>
  {% endif %}
  <span class="pagination__meta muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente →</a>
  {% endif %}
</nav>
{% endif %}
