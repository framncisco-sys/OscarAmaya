{% extends "base.html" %}
{% load static %}

{% block title %}Inicio | Paredes{% endblock %}

{% block content %}
<div class="app-wrap">
<section class="card login-card">
  <p class="login-card__brand">
    <img src="{% static 'logo_paredes_bienes_raices.png' %}" alt="Paredes Bienes Raíces" class="login-card__logo" decoding="async">
  </p>
  <h1 class="page-title">Bienvenido</h1>
  <p class="page-lead">Ingrese al sistema o vea el catálogo público de Paredes Bienes Raíces.</p>
  <div class="form-grid">
    <a class="btn-primary btn-block" href="{% url 'login' %}">Ingresar al sistema</a>
    <a class="btn-secondary btn-block" href="{% url 'catalogo:list' %}">Catálogo Bienes Raíces</a>
  </div>
</section>
</div>
{% endblock %}
