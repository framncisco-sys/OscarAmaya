<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    @page { size: A4; margin: 12mm 11mm; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #1a2d42;
      position: relative;
    }
    .pdf-shell { position: relative; z-index: 1; }

    .pdf-header { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid #cfd9e6; }
    .pdf-header-logos { width: 100%; border-collapse: collapse; margin: 0; table-layout: fixed; }
    .pdf-header-logos td {
      width: 33.33%;
      text-align: center;
      vertical-align: middle;
      padding: 4px 8px;
      height: 96px;
    }
    .pdf-logo {
      display: inline-block;
      vertical-align: middle;
      width: auto;
      border: 0;
      object-fit: contain;
    }
    .pdf-logo--desarrollos,
    .pdf-logo--bienes,
    .pdf-logo--empresa,
    .pdf-logo--proyecto,
    .pdf-logo--pbr-br {
      height: 72px;
      max-height: 72px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
    }
    .pdf-logo--proyecto {
      height: 78px;
      max-height: 78px;
      max-width: 240px;
    }
    .pdf-brand-captions { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .pdf-brand-captions .pdf-brand-cell {
      width: 50%;
      text-align: center;
      vertical-align: top;
      padding: 6px 10px;
      border-top: 1px solid #cbd5e1;
      background: #f8fafc;
    }
    .pdf-brand-captions .pdf-brand-kicker {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #003366;
      margin: 0 0 3px;
    }
    .pdf-brand-captions .pdf-brand-name {
      font-size: 13px;
      font-weight: 800;
      color: #003366;
      margin: 0 0 3px;
      line-height: 1.2;
    }
    .pdf-brand-captions .pdf-brand-meta {
      font-size: 9.5px;
      color: #475569;
      line-height: 1.4;
      margin: 0;
    }
    h1 { font-size: 16px; margin: 0 0 10px; color: #003366; }
    h2 { font-size: 12px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; color: #5c6b7a; }
    .muted { color: #5c6b7a; }
    .row { display: flex; gap: 18px; }
    .col { flex: 1; }
    .box { border: 1px solid #cfd9e6; border-radius: 8px; padding: 10px; background: #fafbfd; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px 4px; border-bottom: 1px solid #e4eaf2; vertical-align: top; }
    th { text-align: left; color: #5c6b7a; font-weight: 700; background: #f0f4f9; }
    .right { text-align: right; }
    {% block pdf_extra_styles %}{% endblock %}
  </style>
</head>
<body{% block pdf_body_class %}{% endblock %}>
  {% block pdf_watermark %}{% endblock %}
  <div class="pdf-shell">
  {% block pdf_header %}
  <div class="pdf-header">
    <table class="pdf-header-logos">
      <tr>
        <td>
          <img src="{% firstof logo_desarrollos_src empresa_logo_src 'logo_paredes_desarrollos.png' %}" alt="Paredes Desarrollos Inmobiliarios" class="pdf-logo pdf-logo--desarrollos">
        </td>
        <td>
          <img src="{% firstof proyecto_logo_src 'logo_valle_alegre.png' %}" alt="{% firstof proyecto_nombre 'Proyecto' %}" class="pdf-logo pdf-logo--proyecto">
        </td>
        <td>
          <img src="{% firstof logo_bienes_src 'logo_paredes_bienes_raices.png' %}" alt="Paredes Bienes Raíces" class="pdf-logo pdf-logo--bienes">
        </td>
      </tr>
    </table>
    {% block pdf_brand_captions %}{% endblock %}
  </div>
  {% endblock %}
  {% block content %}{% endblock %}
  </div>
</body>
</html>
